[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zeeml-cadence"
version = "1.0.0"
description = "Zero-dependency sentence burstiness, Yule's K diversity, readability, CGPA equivalency, and RFC-4180 JSON-to-CSV toolkit by ZeeML (zeeml.com)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [
  { name = "ZeeML Engineering", email = "engineering@zeeml.com" }
]
keywords = ["ai-humanizer", "burstiness", "lexical-entropy", "json-to-csv", "cgpa-calculator", "zeeml"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Linguistic",
]

[project.scripts]
zeeml-cadence = "zeeml_cadence.cli:main"

[project.urls]
Homepage = "https://zeeml.com/ai-humanizer"
Documentation = "https://zeeml.com/ai-detector"
Repository = "https://github.com/Zee-ML/zeeml-python-sdk"
"Interactive Workbenches" = "https://zeeml.com/tools"
"JSON to CSV Studio" = "https://zeeml.com/json-to-csv"
"CGPA Calculator" = "https://zeeml.com/cgpa-calculator"
